[package]
name = "instanz"
description = "ExtOS hypervisor and runlevel engine — snapshots, weaver, container runtime"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://gitlab.com/extos-os"
authors = ["ExtOS Contributors"]

[[bin]]
name = "instanz"
path = "src/main.rs"

[dependencies]
libextos = { path = "../libextos" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tonic = "0.14.6"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros"] }
tonic-prost = "0.14.6"

[dev-dependencies]
tempfile = "3"
